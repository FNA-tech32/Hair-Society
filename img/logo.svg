<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 59" width="220" height="59">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Prata&amp;family=Work+Sans:wght@500;600&amp;display=swap');
      .brand-title {
        font-family: 'Prata', 'Playfair Display', Georgia, serif;
        font-size: 21px;
        fill: #ffffff;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .brand-sub {
        font-family: 'Work Sans', 'Lato', sans-serif;
        font-size: 7px;
        font-weight: 600;
        fill: #9e8a78;
        letter-spacing: 2.4px;
        text-transform: uppercase;
      }
      .gold-accent {
        fill: #9e8a78;
      }
    </style>
  </defs>

  <!-- Left Icon: Stylized Scissor & Comb Emblem -->
  <g transform="translate(4, 5)">
    <!-- Scissor Loop 1 -->
    <circle cx="12" cy="40" r="6" stroke="#9e8a78" stroke-width="2.5" fill="none"/>
    <!-- Scissor Loop 2 -->
    <circle cx="28" cy="40" r="6" stroke="#9e8a78" stroke-width="2.5" fill="none"/>
    <!-- Scissor Pivot -->
    <circle cx="20" cy="27" r="2" fill="#ffffff"/>
    <!-- Blade 1 -->
    <path d="M15 36 L20 27 L33 7 C34 5 32 4 30 6 L18 25 L10 36 Z" fill="#9e8a78"/>
    <!-- Blade 2 -->
    <path d="M25 36 L20 27 L7 7 C6 5 8 4 10 6 L22 25 L30 36 Z" fill="#9e8a78"/>
    <!-- Comb Spine -->
    <rect x="3" y="10" width="34" height="2" rx="1" fill="#c4b5a5" transform="rotate(-30 20 11)"/>
    <!-- Comb Teeth -->
    <line x1="8" y1="12" x2="6" y2="18" stroke="#c4b5a5" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="12" y1="14" x2="10" y2="20" stroke="#c4b5a5" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="16" y1="16" x2="14" y2="22" stroke="#c4b5a5" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="20" y1="18" x2="18" y2="24" stroke="#c4b5a5" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="24" y1="20" x2="22" y2="26" stroke="#c4b5a5" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="28" y1="22" x2="26" y2="28" stroke="#c4b5a5" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="52" y="29" class="brand-title">HAIR SOCIETY</text>
  <text x="53" y="44" class="brand-sub">LUXURY SALON &amp; BARBERSHOP</text>
  <line x1="53" y1="48" x2="210" y2="48" stroke="#9e8a78" stroke-width="0.8" stroke-opacity="0.6"/>
</svg>

